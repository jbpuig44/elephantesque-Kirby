# Inspection EN LECTURE SEULE de l'arborescence content/ en prod (Gandi), pour
# diagnostiquer la structure des pages. Ne modifie rien sur le serveur.
# Déclenchement : manuel (workflow_dispatch). À supprimer une fois le diagnostic fait.

name: Inspect content (read-only)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: List remote content/ tree
        env:
          HOST: ${{ secrets.GANDI_SFTP_HOST }}
          SFTP_USER: ${{ secrets.GANDI_SFTP_USER }}
          SFTP_PASS: ${{ secrets.GANDI_SFTP_PASSWORD }}
          REMOTE: ${{ secrets.GANDI_REMOTE_PATH }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          open -u \"$SFTP_USER,$SFTP_PASS\" sftp://$HOST
          cd \"$REMOTE\"
          echo '===== ls content/ ====='
          cls -l content/
          echo '===== find content/ (récursif) ====='
          find content/
          "
