# Suppression UNIQUE du dossier parasite content/recettes/ créé par erreur en
# prod (page non listée entrant en collision de slug avec la vraie page listée
# content/1_recettes/). Cible exclusivement content/recettes/ ; ne touche à rien
# d'autre. Déclenchement manuel (workflow_dispatch). À supprimer après usage.

name: Cleanup stray content/recettes

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Remove stray content/recettes/ (exact target)
        env:
          HOST: ${{ secrets.GANDI_SFTP_HOST }}
          SFTP_USER: ${{ secrets.GANDI_SFTP_USER }}
          SFTP_PASS: ${{ secrets.GANDI_SFTP_PASSWORD }}
          REMOTE: ${{ secrets.GANDI_REMOTE_PATH }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          open -u \"$SFTP_USER,$SFTP_PASS\" sftp://$HOST
          cd \"$REMOTE\"
          echo '===== AVANT : ls content/ ====='
          cls -l content/
          echo '===== rm -r content/recettes/ (parasite uniquement) ====='
          rm -r content/recettes
          echo '===== APRES : ls content/ ====='
          cls -l content/
          "
